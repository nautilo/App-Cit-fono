name: citofono_app
description: App de Intercomunicador con videollamadas WebRTC y Firebase
publish_to: 'none'
version: 1.0.1+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP
  http: ^1.2.0
  # Socket.IO
  socket_io_client: ^2.0.3+1
  # WebRTC
  flutter_webrtc: ^1.4.1
  # Audio PCM / citofono
  flutter_sound: 9.28.0
  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Almacenamiento local (sesión)
  shared_preferences: ^2.3.2
  # Permisos de cámara y micrófono
  permission_handler: ^11.3.1
  # Iconos de Material Design
  cupertino_icons: ^1.0.8

  # Tono de llamada entrante
  flutter_ringtone_player: ^4.0.0
  # Notificaciones locales
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
